<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lingora — Learn. Speak. Grow.</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;color:#182033;background:#f7f8fc}*{box-sizing:border-box}button,select,input{font:inherit}.wrap{max-width:1100px;margin:auto;padding:0 22px}header{height:72px;background:#fff;border-bottom:1px solid #e7eaf1;display:flex;align-items:center}.nav{display:flex;justify-content:space-between;align-items:center}.logo{font-size:27px;font-weight:900;color:#5b4cf0}.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:750;cursor:pointer}.primary{background:#5b4cf0;color:#fff}.light{background:#fff;border:1px solid #e7eaf1}.hero{padding:52px 0 35px;background:linear-gradient(135deg,#f2efff,#fff)}h1{font-size:46px;letter-spacing:-2px;margin:0 0 8px}.muted{color:#687386}.search{margin-top:25px;background:#fff;padding:14px;border:1px solid #e7eaf1;border-radius:17px}.fields{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:9px}.field{border:1px solid #e7eaf1;border-radius:10px;padding:8px 11px}.field small{display:block;color:#7d8796;font-size:10px}.field select{border:0;width:100%;outline:0;background:#fff;font-weight:700}.tutors{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding:38px 0}.card{background:#fff;border:1px solid #e7eaf1;border-radius:17px;overflow:hidden}.cover{height:150px;background:#ece9ff;display:flex;align-items:center;justify-content:center;font-size:70px}.body{padding:17px}.name{font-size:18px;font-weight:850}.rating{float:right;font-weight:800;font-size:13px}.bio{font-size:13px;line-height:1.5}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{background:#f0f1f5;border-radius:99px;padding:5px 8px;font-size:11px}.bottom{border-top:1px solid #e7eaf1;margin-top:13px;padding-top:13px;display:flex;justify-content:space-between;align-items:center}.price{font-weight:900}.empty{text-align:center;padding:40px;grid-column:1/-1}.modal{display:none;position:fixed;inset:0;background:#11182799;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:20px;max-width:650px;width:100%;padding:25px;position:relative;max-height:90vh;overflow:auto}.close{position:absolute;right:15px;top:14px;border:0;border-radius:50%;width:34px;height:34px}.avatar{font-size:48px}.profileHead{display:flex;gap:15px;align-items:center}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.slot{background:#fff;border:1px solid #e7eaf1;border-radius:9px;padding:10px;cursor:pointer}.slot:hover{border-color:#5b4cf0;color:#5b4cf0}.summary{background:#f7f8fc;border-radius:12px;padding:15px;margin:18px 0}.row{display:flex;justify-content:space-between;margin:8px 0}.field2{display:block;width:100%;border:1px solid #e7eaf1;border-radius:10px;padding:11px;margin:8px 0}.notice{background:#fff8e6;padding:12px;border-radius:10px;font-size:13px}.toast{position:fixed;right:18px;bottom:18px;background:#151a29;color:#fff;padding:13px 16px;border-radius:10px;display:none;z-index:20}footer{background:#151a29;color:#fff;padding:35px 0;margin-top:15px}footer .logo{color:#fff}@media(max-width:850px){.fields{grid-template-columns:1fr 1fr}.tutors{grid-template-columns:1fr 1fr}}@media(max-width:600px){h1{font-size:37px}.fields,.tutors,.slots{grid-template-columns:1fr}.box{padding:20px}}</style><script src="supabase-auth.js" defer></script><script src="tutor-onboarding.js" defer></script></head><body><header><div class="wrap nav"><div class="logo">lingora</div><div class="actions"><button class="btn light" onclick="toast('Loading account…')">Log in</button> <button class="btn primary" onclick="toast('Loading account…')">Get started</button></div></div></header><section class="hero"><div class="wrap"><h1>Find a tutor who fits you.</h1><p class="muted">Affordable language lessons across Europe. From €4.</p><div class="search"><div class="fields"><div class="field"><small>Language</small><select id="language"><option>All languages</option><option>English</option><option>French</option><option>Spanish</option><option>German</option></select></div><div class="field"><small>Level</small><select id="level"><option>All levels</option><option>A1</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select></div><div class="field"><small>Goal</small><select id="goal"><option>Any goal</option><option>Conversation</option><option>Business</option><option>Finance</option><option>Travel</option><option>Exams</option></select></div><div class="field"><small>Max price</small><select id="price"><option value="10">€10</option><option value="8">€8</option><option value="7">€7</option><option value="5">€5</option></select></div><button class="btn primary" onclick="filterTutors()">Search</button></div></div></div></section><main class="wrap"><div style="padding-top:30px"><h2>Recommended tutors</h2><p class="muted">Choose a tutor, select a time and request your lesson.</p></div><div class="tutors" id="tutors"></div></main><footer><div class="wrap"><div class="logo">lingora</div><p>Learn. Speak. Grow.</p><small>© 2026 Lingora · Prototype</small></div></footer><div class="modal" id="modal"><div class="box"><button class="close" onclick="closeModal()">×</button><div id="modalContent"></div></div></div><div class="toast" id="toast"></div><script>const tutors=[{id:1,name:'Sarah M.',flag:'🇬🇧',lang:'English',level:['B1','B2','C1'],goals:['Business','Finance','Conversation'],price:8,rating:4.9,reviews:126,exp:'8 years',avatar:'👩🏽‍🏫',bio:'I help professionals communicate confidently in meetings, presentations and international business.'},{id:2,name:'Carlos R.',flag:'🇪🇸',lang:'Spanish',level:['A1','A2','B1','B2'],goals:['Conversation','Travel'],price:5,rating:4.8,reviews:61,exp:'6 years',avatar:'👨🏾‍🏫',bio:'Friendly Spanish lessons for beginners and travellers, with lots of speaking practice.'},{id:3,name:'Marie L.',flag:'🇫🇷',lang:'French',level:['A1','A2','B1','C1'],goals:['Conversation','Travel','Business'],price:6,rating:4.9,reviews:93,exp:'10 years',avatar:'👩🏾‍🏫',bio:'Practical French for everyday life, travel and professional communication.'},{id:4,name:'Lukas H.',flag:'🇩🇪',lang:'German',level:['A1','A2','B1','B2'],goals:['Business','Exams'],price:7,rating:4.7,reviews:48,exp:'7 years',avatar:'👨🏻‍🏫',bio:'Structured German lessons focused on clear communication and exam preparation.'},{id:5,name:'Emma T.',flag:'🇬🇧',lang:'English',level:['A2','B1','B2'],goals:['Conversation','Travel'],price:5,rating:4.8,reviews:84,exp:'5 years',avatar:'👩🏼‍🏫',bio:'Relaxed conversation practice to help you speak naturally and confidently.'},{id:6,name:'Daniel K.',flag:'🇬🇧',lang:'English',level:['B1','B2','C1'],goals:['Business','Finance'],price:10,rating:5,reviews:39,exp:'12 years',avatar:'👨🏽‍🏫',bio:'Specialist English for finance, interviews, presentations and senior professionals.'}];function render(list=tutors){document.getElementById('tutors').innerHTML=list.length?list.map(t=>`<article class="card"><div class="cover">${t.avatar}</div><div class="body"><span class="rating">★ ${t.rating} (${t.reviews})</span><div class="name">${t.name} ${t.flag}</div><div class="muted">${t.lang} tutor · ${t.exp}</div><p class="bio">${t.bio}</p><div class="tags">${t.goals.map(g=>`<span class="tag">${g}</span>`).join('')}</div><div class="bottom"><div class="price">€${t.price} <small class="muted">/ 50 min</small></div><button class="btn primary" onclick="profile(${t.id})">View profile</button></div></div></article>`).join(''):`<div class="empty"><h3>No tutors found</h3><p class="muted">Try a different filter.</p></div>`}function filterTutors(){const l=language.value,lev=level.value,g=goal.value,max=+price.value;render(tutors.filter(t=>(l==='All languages'||t.lang===l)&&(lev==='All levels'||t.level.includes(lev))&&(g==='Any goal'||t.goals.includes(g))&&t.price<=max));document.getElementById('tutors').scrollIntoView({behavior:'smooth'})}function profile(id){const t=tutors.find(x=>x.id===id);modalContent.innerHTML=`<div class="profileHead"><div class="avatar">${t.avatar}</div><div><h2 style="margin:0">${t.name} ${t.flag}</h2><div class="muted">${t.lang} · ★ ${t.rating} · ${t.reviews} reviews</div><b>€${t.price} / 50 min</b></div></div><p style="line-height:1.6">${t.bio}</p><h3>Choose a lesson time</h3><div class="slots">${['Today · 18:00','Today · 19:30','Tomorrow · 10:00','Tomorrow · 14:00','Tomorrow · 17:00','Friday · 18:30'].map(s=>`<button class="slot" onclick="checkout(${t.id},'${s}')">${s}</button>`).join('')}</div>`;modal.classList.add('show')}function checkout(id,time){const t=tutors.find(x=>x.id===id);modalContent.innerHTML=`<h2>Confirm your lesson</h2><div class="summary"><div class="row"><span>Tutor</span><b>${t.name}</b></div><div class="row"><span>Language</span><b>${t.lang}</b></div><div class="row"><span>Date & time</span><b>${time}</b></div><div class="row"><span>Duration</span><b>50 minutes</b></div><div class="row"><span>Total</span><b>€${t.price}</b></div></div><h3>Your details</h3><input class="field2" placeholder="Your name"><input class="field2" type="email" placeholder="Your email"><div class="notice">🔒 This is a prototype. No real payment will be taken.</div><button class="btn primary" style="width:100%;margin-top:15px" onclick="confirmBooking('${t.name}','${time}',${t.price})">Confirm booking</button>`}function confirmBooking(n,time,p){modalContent.innerHTML=`<div style="text-align:center;padding:20px"><div style="font-size:55px">🎉</div><h2>Lesson requested!</h2><p class="muted">Your ${n} lesson is scheduled for <b>${time}</b>.</p><div class="summary"><div class="row"><span>Lesson</span><b>50 minutes</b></div><div class="row"><span>Price</span><b>€${p}</b></div></div><div class="notice">This prototype doesn't process real payments yet. We'll connect checkout in the next stage.</div><button class="btn primary" style="margin-top:15px" onclick="closeModal()">Back to tutors</button></div>`}function closeModal(){modal.classList.remove('show')}function toast(m){const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2200)}render();</script></body></html>
